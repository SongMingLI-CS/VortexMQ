name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vortexmq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vortexmq
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vortexmq
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Byte-compile every tracked Python package
        run: python -m compileall -q app tests sdk examples scripts

      - name: Verify Alembic migrations apply on an empty database
        run: python -m alembic upgrade head

      # 禁止 xdist 并发：多个测试进程会互相删 Redis 键、抢同一测试库 schema。
      - name: Run tests (serial)
        run: pytest -q -p no:xdist

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` 先跑 tsc（tsconfig strict），再 vite build：
      # 类型错误会直接让流水线红掉，防止前端静默漂移。
      - name: Typecheck and build console
        run: npm run build

