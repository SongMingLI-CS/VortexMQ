# 控制台静态站点 + 同源 /api 反向代理。
# 浏览器只访问控制台端口，不直连 API，因此无需 CORS 配置。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 用 Docker 内嵌 DNS 动态解析 upstream（127.0.0.11）：
    # 1) api 容器重建换 IP 后无需 reload nginx；
    # 2) api 一时不可解析也不会让 nginx 启动失败（静态 proxy_pass 会）。
    # 变量形式的 proxy_pass 不含路径，因此原始 URI 原样透传。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $vortexmq_api http://api:8000;

    # 管理面 API（X-Admin-Key 由前端 localStorage 提供，Nginx 不做鉴权）
    location /api/ {
        proxy_pass $vortexmq_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 把服务端生成的 request id 透传给浏览器，便于用户报错时对日志
        proxy_pass_header X-Request-ID;
        # DAG 详情 / 大批量翻页偶尔较慢，给足读超时
        proxy_read_timeout 120s;
    }

    location = /health {
        proxy_pass $vortexmq_api;
    }

    # SPA fallback：静态资源不存在时回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
